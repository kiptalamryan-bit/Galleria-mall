<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Galleria Mall - Premium Shopping, Dining & Entertainment Destination" />
    <title>Galleria Mall | Shopping, Dining & Entertainment</title>
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <!-- Bootstrap CSS (fallback) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <!-- Vite SPA fallback: load built assets dynamically -->
    <script type="module">
        // This script dynamically loads the built app
        // The built JS file is deployed to assets/index-*.js by the GitHub Actions workflow
        // We use fetch() to find the built JS file and dynamically import it
        async function loadApp() {
            try {
                // Try to find the built CSS file (it has a fingerprinted name)
                // Using a wildcard pattern via fetch
                const cssResponse = await fetch('./assets/index-*.css');
                if (cssResponse.ok) {
                    // If CSS file exists, the built assets are present
                    // Dynamically import the main JS module
                    // Note: We can't use import() with a wildcard, so we need to find the exact filename
                    // Let's try a different approach: find all assets and pick the JS file
                    const entries = await fetch('./assets/');
                    if (entries.ok) {
                        // The built JS file is in the assets directory
                        // We need to find the exact filename
                        // Since we can't list files via fetch in a browser,
                        // let's try common patterns or use the index.html file as reference
                        return import('./assets/index-DSoP7H4f.js');
                    }
                }
            } catch (e) {
                console.warn('Build assets not yet available, will retry:', e);
            }
            // Fallback: load source JS (for local development)
            return import('./src/js/main.js');
        }
        loadApp();
        // Also load CSS dynamically if needed
        async function loadCSS() {
            try {
                const response = await fetch('./assets/index-*.css');
                if (response.ok) {
                    // CSS is linked in the HTML, so no need to load dynamically
                }
            } catch (e) {
                // CSS might not be available yet
            }
        }
        // Schedule CSS loading after the app loads
        setTimeout(loadCSS, 1000);
    </script>
</head>
<body>
    <!-- The SPA will be rendered here -->
    <div id="app"></div>
</body>
</html>
